server:
  shutdown: graceful
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    template:
      observation-enabled: true   # producer spans and a traceparent header on every message
    producer:
      acks: all
      properties:
        enable.idempotence: true

outbox:
  relay:
    interval: 500ms
    batch-size: 100

management:
  tracing:
    sampling:
      probability: 1.0   # keep every trace locally; lower this in production
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces   # Jaeger from docker compose
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
