# Two replicas share the fulfilment-service consumer group, so the topic's 3 partitions are split between them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfilment-service
  labels:
    app: fulfilment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fulfilment-service
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: fulfilment-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: fulfilment-service
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/fulfilment
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: username }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: password }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # One JSON object per log line (Elastic Common Schema), with traceId and spanId, ready for a log shipper.
            - name: LOGGING_STRUCTURED_FORMAT_CONSOLE
              value: ecs
            # No trace collector in this cluster. Trace ids still go into every log line.
            - name: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Startup can take a while on a small node, so the other probes wait for it.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          lifecycle:
            # Give the Service time to stop routing here before Spring starts its graceful shutdown.
            preStop:
              sleep:
                seconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fulfilment-service
spec:
  selector:
    app: fulfilment-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fulfilment-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fulfilment-service
