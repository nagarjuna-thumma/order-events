server:
  shutdown: graceful
  port: 8081

spring:
  application:
    name: fulfilment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fulfilment
    username: app
    password: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

fulfilment:
  retry:
    initial-interval-ms: 1000
    max-attempts: 3
  webhooks:
    max-attempts: 12         # backoff doubles up to 1h, so about 3.5 hours before giving up
    initial-backoff: 10s
    max-backoff: 1h
    timeout: 5s
    poll-interval: 1s

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
